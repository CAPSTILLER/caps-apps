<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CAP Apps</title>
  <meta name="description" content="Cap's web apps in one place. Tap an icon to open it." />
  <meta name="theme-color" content="#c9a227" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CAP Apps" />
  <meta name="application-name" content="CAP Apps" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CAP Apps" />
  <meta property="og:description" content="Cap's web apps in one place." />
  <meta property="og:image" content="/icon-512.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <section class="shell">
      <header class="header">
        <button id="gearBtn" class="gear-btn" type="button" aria-label="Contract addresses"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
        <h1 class="pid-title">CAP Apps</h1>
        <p class="subtitle">Tap to open</p>
      </header>
      <div id="grid" class="grid" aria-label="App list"></div>
      <p id="empty" class="empty" hidden></p>
    </section>
    <p class="footer">Add to Home Screen for a quick launch. Built for <a href="https://gearup.wtf/" rel="noopener noreferrer">gearup.wtf</a>.</p>
  </div>
  <div id="addrSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="addrTitle">
    <div class="sheet-panel">
      <div class="sheet-head"><h2 id="addrTitle">Addresses</h2><button id="addrClose" class="sheet-close" type="button" aria-label="Close">&times;</button></div>
      <p class="sheet-note">Tap Copy to grab an address. All on Base.</p>
      <div id="addrList"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden>Copied</div>
  <script src="./js/app.js"></script>
  <script src="./js/contracts.js"></script>
</body>
</html>
